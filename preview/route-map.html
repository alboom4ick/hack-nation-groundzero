<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route map preview</title>
<style>/* Shared visual language: warm paper, deep teal, Atkinson Hyperlegible. */

:root {
  --bg:#f5f1ea; --surface:#fffdf9; --card:#fff; --fg:#242722; --muted:#5e645c; --line:#cbc7be;
  --accent:#176b63; --accent-ink:#fff; --tint:#ddede8;
  --warn:#b45309; --ok:#176b63; --rec:#b3261e;
  --shadow:0 8px 12px rgba(48,41,31,.08);
  --r-card:22px; --r-btn:14px;
}
/* High-contrast set, from the design's "High Contrast" frames. */
@media (prefers-contrast: more) {
  :root:not([data-theme="light"]) { --bg:#fff; --surface:#fff; --fg:#000; --muted:#1f2420; --line:#242722; --accent:#0b4a44; --tint:#d4ebe5; --shadow:none; }
}
:root[data-theme="contrast"] { --bg:#fff; --surface:#fff; --fg:#000; --muted:#1f2420; --line:#242722; --accent:#0b4a44; --tint:#d4ebe5; --shadow:none; }

* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:400 18px/1.5 'Atkinson Hyperlegible', system-ui, sans-serif; }
main { max-width:1312px; margin:0 auto; padding:48px 32px 96px; }
h1 { font-size:48px; line-height:1.08; font-weight:700; margin:0 0 16px; }
h3 { font-size:24px; font-weight:700; line-height:1.2; }
h4 { font-weight:700; }
p.sub, .sub { color:var(--muted); font-size:22px; line-height:1.45; margin:0 0 32px; max-width:62ch; }
.hint { color:var(--muted); font-size:16px; }
em { font-style:normal; font-weight:700; color:var(--fg); }

/* App header band */
.app-header { background:var(--surface); border-bottom:1px solid var(--line); min-height:80px; padding:16px 48px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand { display:flex; align-items:center; gap:12px; font-weight:700; font-size:24px; }
.brand svg { width:32px; height:32px; stroke:var(--accent); fill:none; stroke-width:1.5; stroke-linejoin:round; }
.pill { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--fg); background:var(--surface); border-radius:999px; padding:8px 16px; font-weight:700; font-size:16px; }
.pill.tint { background:var(--tint); border-color:var(--accent); }
.eyebrow { color:var(--accent); font-weight:700; font-size:16px; letter-spacing:1px; text-transform:uppercase; margin:0 0 12px; }

/* Cards */
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:24px; margin-bottom:24px; box-shadow:var(--shadow); }
.card.selected, .card.recording { border:2px solid var(--accent); background:var(--tint); }
#live-card.recording { border-color:var(--rec); }

/* Buttons */
button { background:var(--accent); color:var(--accent-ink); border:2px solid var(--accent); border-radius:var(--r-btn); min-height:48px; padding:10px 22px; font:700 18px/1.2 'Atkinson Hyperlegible', system-ui, sans-serif; cursor:pointer; }
button:hover:not(:disabled) { filter:brightness(1.12); }
button:disabled { opacity:.5; cursor:default; }
#pager button:disabled { opacity:.3; cursor:not-allowed; filter:grayscale(1); }
button.ghost { background:var(--surface); color:var(--fg); border:1px solid var(--fg); }
button.ghost:hover:not(:disabled) { background:var(--tint); filter:none; }
button.link { background:none; color:var(--accent); border:0; min-height:0; padding:0 2px; font-size:14px; text-decoration:underline; }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }

input[type=text], input:not([type]) { border:1px solid var(--line); border-radius:var(--r-btn); background:var(--surface); color:var(--fg); font:inherit; }
progress { accent-color:var(--accent); }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
[hidden] { display:none !important; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--line); margin-right:6px; vertical-align:middle; }
.dot.on { background:var(--ok); }
video { width:100%; max-height:420px; background:#000; border-radius:var(--r-btn); }
#video:not([hidden]) { position:sticky; top:0; z-index:20; box-shadow:0 8px 16px -8px rgba(0,0,0,.35); }
summary { cursor:pointer; color:var(--muted); font-size:16px; margin-bottom:4px; }

/* Voice panel */
#voice { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:0 8px 30px rgba(48,41,31,.18); }
#orb { background:radial-gradient(circle at 35% 30%, #8fd1c7, var(--accent)); }
#voice-q { font-weight:700; }
#voice-a { color:var(--muted); font-size:16px; min-height:1.2em; }
#alert { border:2px solid var(--warn); }

/* Steps / timeline */
.mstep, .tstep { border-left:4px solid var(--accent); padding:6px 0 6px 16px; margin-bottom:16px; }
.tstep { border-left-color:var(--line); }
.tstep.now { border-color:var(--accent); }
.tstep.right, .tstep.good { border-color:var(--ok); }
.tstep.wrong, .tstep.bad { border-color:var(--warn); }
.mstep h4, .tstep h4 { margin:0 0 4px; font-size:20px; }
.mstep .field { font-size:16px; margin:2px 0; }
.mstep .field b { color:var(--muted); font-weight:700; display:inline-block; min-width:90px; }
.mstep .quote, .tstep .quote { font-style:normal; color:var(--muted); }
.mstep .gap { color:var(--warn); }
.tstep .meta { color:var(--muted); font-size:16px; }

@media (max-width:768px) {
  main { padding:32px 16px 96px; }
  h1 { font-size:36px; }
  .app-header { padding:16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* ---- Warm, guided layer for older experts ---- */
h1, h2, .display { font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif; letter-spacing:-.01em; }
h2 { font-size:32px; line-height:1.15; margin:0 0 8px; }
html[data-size="large"] body { zoom:1.15; }
html[data-size="xlarge"] body { zoom:1.3; }
body { background:radial-gradient(1200px 500px at 85% -10%, #efe6d3 0, transparent 60%), var(--bg); }
:root[data-theme="contrast"] body { background:#fff; }
button { transition:transform .12s, filter .12s, background .12s; }
button:active:not(:disabled) { transform:translateY(1px); }
button.big { min-height:72px; font-size:24px; padding:16px 32px; border-radius:18px; box-shadow:0 4px 0 rgba(0,0,0,.18); }
button.big:disabled { box-shadow:none; }
.skip { position:absolute; left:-999px; top:8px; background:var(--fg); color:var(--bg); padding:12px 20px; border-radius:var(--r-btn); z-index:99; font-weight:700; }
.skip:focus { left:8px; }

/* Accessibility bar */
.a11y { display:flex; gap:8px; align-items:center; }
.a11y button { min-height:44px; padding:6px 14px; font-size:16px; background:var(--surface); color:var(--fg); border:1px solid var(--fg); }
.a11y button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
.a11y .sizes { display:flex; }
.a11y .sizes button { border-radius:0; margin-left:-1px; }
.a11y .sizes button:first-child { border-radius:var(--r-btn) 0 0 var(--r-btn); margin-left:0; }
.a11y .sizes button:last-child { border-radius:0 var(--r-btn) var(--r-btn) 0; }

/* Hero + stepper */
.hero { max-width:760px; margin-bottom:32px; }
.hero h1 { font-size:56px; }
.stepper { list-style:none; display:flex; gap:12px; padding:0; margin:0 0 32px; flex-wrap:wrap; }
.stepper li { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 20px 8px 8px; font-weight:700; }
.stepper li b { width:36px; height:36px; border-radius:50%; background:var(--line); color:var(--fg); display:grid; place-items:center; }
.stepper li.now { border-color:var(--accent); background:var(--tint); }
.stepper li.now b, .stepper li.done b { background:var(--accent); color:var(--accent-ink); }
.stepper li.done { border-color:var(--accent); }

.lead-card { display:grid; grid-template-columns:1.1fr 1fr; gap:32px 48px; align-items:start; padding:40px; border:2px solid var(--accent); }
.live-options { grid-column:2; grid-row:1 / 3; display:grid; gap:20px; padding:24px; border-radius:var(--r-card); background:var(--surface); border:1px solid var(--line); }
.live-options .field { display:grid; gap:8px; font-size:16px; }
.live-options .field select, .live-options .field input[type=text] { width:100%; box-sizing:border-box; min-height:48px; padding:8px 14px; font-size:18px; }
.live-options .check { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; line-height:1.4; }
.live-options .check input { width:22px; height:22px; margin:0; }
.lead-card button.big { grid-column:1; justify-self:start; align-self:end; min-width:340px; }
.lead-card h2 { margin:0 0 8px; }
.lead-card p { margin:0; color:var(--muted); line-height:1.5; }
.promises { list-style:none; margin:24px 0 0; padding:0; display:grid; gap:14px; }
.promises li { position:relative; padding-left:40px; }
.promises li::before { content:'✓'; position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--tint); color:var(--accent); font-weight:700; display:grid; place-items:center; }
#live-status { grid-column:1 / -1; font-size:18px; }
#live-status:empty { display:none; }
.alt { background:transparent; border:2px dashed var(--line); box-shadow:none; }
.alt summary { font-size:18px; font-weight:700; color:var(--fg); margin:0; padding:4px 0; }
.alt[open] summary { margin-bottom:16px; }
input[type=file] { font:inherit; padding:12px; border:2px dashed var(--line); border-radius:var(--r-btn); background:var(--surface); }
input[type=file]::file-selector-button { font:700 18px 'Atkinson Hyperlegible',sans-serif; min-height:44px; padding:8px 18px; margin-right:16px; border-radius:12px; border:1px solid var(--fg); background:var(--surface); color:var(--fg); cursor:pointer; }
.next-title { font-family:'Iowan Old Style',Georgia,serif; font-size:28px; margin:32px 0 12px; }
#tools button { min-height:56px; }

@media (max-width:768px) {
  .hero h1 { font-size:40px; }
  .lead-card { grid-template-columns:1fr; padding:24px; }
  .lead-card button.big { min-width:0; grid-column:auto; }
  .live-options { grid-column:auto; grid-row:auto; }
  .lead-card button.big { width:100%; }
  .app-header { flex-wrap:wrap; }
}

/* ---- Spacing pass: card heads, step lists, option panels ---- */
.card { padding:32px; }
.card-head { display:flex; justify-content:space-between; align-items:center; gap:16px 24px; flex-wrap:wrap; margin-bottom:24px; }
.card-head h3 { margin:0; }
.live-options.inline { grid-column:auto; grid-row:auto; grid-template-columns:1fr 1fr; align-items:start; margin-bottom:28px; }
.live-options.inline .check { align-self:end; }
.load-row { gap:20px 28px; }
#load-msg { margin-top:16px; }
#load-msg:empty { display:none; }
ol.steps, #map-steps { list-style:none; margin:0; padding:0; display:grid; gap:20px; }
ol.steps .tstep, #map-steps .mstep { margin:0; padding:10px 0 10px 20px; }
.mstep h4, .tstep h4 { margin:0 0 8px; }
.mstep .field { margin:4px 0; }
#map-timeline { margin:20px 0 24px; gap:10px; }
#debrief { border-top:1px solid var(--line); margin-top:28px; padding-top:24px; display:grid; gap:12px; }
#debrief p { margin:0; }
#debrief-open:empty, #teachback:empty { display:none; }
#tools { margin:0 0 32px; gap:16px; }
#alert h3, #summary h3 { margin:0 0 12px; }
#summary ul { margin:0 0 20px; padding-left:24px; display:grid; gap:6px; }
@media (max-width:768px) {
  .card { padding:24px; }
  .live-options.inline { grid-template-columns:1fr; }
  .card-head button { width:100%; }
}

main{padding:32px}
/* Route map: git-graph lanes with BPMN shapes */
.rm-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--card); padding:8px 4px 4px; margin:8px 0 6px; }
.rm { display:block; font-family:inherit; --k-limit:#a24e00; --k-exception:#6a3d9a; --k-stop_and_ask:var(--rec); }
.rm .rm-main { stroke:var(--accent); stroke-width:3; fill:none; }
.rm .rm-arrow { fill:var(--accent); }
.rm .rm-event { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.rm .rm-event.end { stroke-width:5; }
.rm .rm-chip rect { fill:var(--tint); stroke:var(--accent); }
.rm .rm-chip text { font-size:12px; font-weight:700; fill:var(--accent); }
.rm [data-step] { cursor:pointer; outline:none; }
.rm .rm-task rect:first-of-type { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.rm .rm-task.off rect:first-of-type { stroke-dasharray:6 5; }
.rm .off { opacity:.45; }
.rm .rm-title { font-size:15px; font-weight:700; fill:var(--fg); }
.rm .rm-time { font-size:12px; fill:var(--muted); }
.rm .rm-num-dot { fill:var(--accent); stroke:var(--card); stroke-width:3; }
.rm .rm-num { font-size:13px; font-weight:700; fill:var(--accent-ink); }
.rm .rm-yours { fill:var(--tint); stroke:var(--accent); } .rm .rm-yours-t { font-size:11px; font-weight:700; fill:var(--accent); }
.rm .rm-diamond { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.rm .rm-x { stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; fill:none; }
.rm .rm-label-leader { stroke:var(--muted); stroke-width:1.5; stroke-dasharray:2 4; fill:none; }
.rm .rm-small { font-size:11px; font-weight:700; letter-spacing:.8px; fill:var(--muted); }
.rm .rm-decision { font-size:13px; font-style:italic; fill:var(--fg); }
.rm .rm-branch { color:var(--k-limit); } .rm .rm-pill { color:var(--k-limit); }
.rm .k-exception { color:var(--k-exception); } .rm .k-stop_and_ask { color:var(--k-stop_and_ask); }
.rm .rm-wire { stroke:currentColor; stroke-width:2.5; fill:none; }
.rm .rm-branch.off .rm-wire { stroke-dasharray:5 5; }
.rm .rm-commit { fill:var(--card); stroke:currentColor; stroke-width:2.5; }
.rm .rm-stop { fill:var(--card); stroke:currentColor; stroke-width:2.5; } .rm .rm-stop-bar { fill:currentColor; }
.rm .rm-pill rect { fill:var(--card); stroke:currentColor; stroke-width:2; }
.rm .rm-glyph-dot { fill:currentColor; } .rm .rm-glyph { font-size:13px; font-weight:700; fill:var(--card); }
.rm .rm-glyph-bar { stroke:var(--card); stroke-width:2.5; stroke-linecap:round; fill:none; }
.rm .rm-pill .rm-small { fill:currentColor; }
.rm .rm-rule { font-size:13px; fill:var(--fg); }
.rm .rm-task:hover rect:first-of-type, .rm .rm-pill:hover rect, .rm .rm-diamond:hover { fill:var(--tint); }
.rm .selected rect:first-of-type, .rm .selected .rm-diamond { fill:var(--tint); stroke-width:3.5; }
.rm .rm-task:focus-visible rect:first-of-type, .rm .rm-pill:focus-visible rect, .rm .rm-gate:focus-visible .rm-diamond { stroke:var(--fg); stroke-width:3.5; }
.rm .rm-branch.selected .rm-wire, .rm .rm-pill.selected rect { stroke-width:4; }
.rm-wrap.fit { overflow-x:hidden; } .rm-wrap.fit .rm { width:100%; height:auto; }
.legend { display:flex; gap:6px 18px; flex-wrap:wrap; color:var(--muted); font-size:14px; margin:0 0 16px; }
.legend i { display:inline-block; vertical-align:-3px; margin-right:6px; width:14px; height:14px; border:2px solid var(--accent); border-radius:4px; }
.legend i.ev { border-radius:50%; } .legend i.gw { transform:rotate(45deg) scale(.8); border-radius:2px; }
.legend i.lim { border-color:#a24e00; border-radius:50%; } .legend i.exc { border-color:#6a3d9a; border-radius:50%; } .legend i.stp { border-color:var(--rec); border-radius:50%; }

/* Progress through a lesson (tutor): where the new hire is, what is done, where they slipped. */
.rm .st-done rect:first-of-type { fill:var(--tint); }
.rm .st-done .rm-num-dot { fill:var(--ok); }
.rm .st-wrong rect:first-of-type { stroke:var(--warn); stroke-width:3.5; }
.rm .st-wrong .rm-num-dot { fill:var(--warn); }
.rm .st-now rect:first-of-type { fill:var(--tint); stroke-width:4.5; }
.rm .st-now .rm-here { display:block; }
.rm .rm-here { display:none; fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:3 5; }

/* Mini route: the same idea squeezed into the floating island. */
.rm-mini { display:block; width:100%; height:auto; max-height:72px; }
.rm-mini .m-line { stroke:var(--line); stroke-width:3; stroke-linecap:round; }
.rm-mini .m-step { fill:var(--card); stroke:var(--muted); stroke-width:2; }
.rm-mini .m-gate { fill:var(--card); stroke:var(--muted); stroke-width:1.5; }
.rm-mini .m-step.st-done { fill:var(--ok); stroke:var(--ok); }
.rm-mini .m-step.st-wrong { fill:var(--warn); stroke:var(--warn); }
.rm-mini .m-step.st-now { fill:var(--accent); stroke:var(--accent); }
.rm-mini .m-ring { fill:none; stroke:var(--accent); stroke-width:2; opacity:.35; }
.rm-mini .m-branch { stroke:currentColor; stroke-width:1.5; fill:none; }
.rm-mini .m-dot { fill:currentColor; }
.rm-mini .k-limit { color:#a24e00; } .rm-mini .k-exception { color:#6a3d9a; } .rm-mini .k-stop_and_ask { color:var(--rec); }

.note{color:var(--muted);font-size:15px;margin:8px 0 24px}</style></head><body><main>
