<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GroundZero</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --line:#292524; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  video { width:100%; max-height:420px; background:#000; border-radius:8px; }
  input[type=file] { width:100%; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  progress { flex:1; min-width:120px; }
  .seg { cursor:pointer; }
  .seg:hover { border-color:var(--accent); }
  .seg h3 { margin:0 0 8px; font-size:14px; }
  .seg .meta { color:var(--muted); font-weight:400; }
  .strip { display:flex; gap:6px; overflow-x:auto; }
  .strip img { height:72px; border-radius:4px; flex:none; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .out { margin-top:10px; }
  .out p { margin:0 0 8px; }
  dl { display:grid; grid-template-columns:110px 1fr; gap:2px 12px; margin:0 0 8px; font-size:13px; }
  dt { color:var(--muted); } dd { margin:0; } dd.missing { color:var(--muted); font-style:italic; }
  .seg { cursor:default; } .seg:hover { border-color:var(--line); }
  summary { cursor:pointer; color:var(--muted); font-size:13px; margin-bottom:4px; }
  .q { border-top:1px solid var(--line); padding:6px 0; }
  .q.current { background:color-mix(in srgb, var(--accent) 10%, transparent); border-radius:6px; padding:6px; }
  .answer { color:var(--muted); font-size:13px; padding-top:2px; }
  #tools { margin-bottom:12px; }
  #voice { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); width:min(560px, calc(100% - 32px)); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; box-shadow:0 8px 30px rgba(0,0,0,.18); display:flex; gap:14px; align-items:center; z-index:10; }
  #voice[hidden] { display:none; }
  #orb { --level:0; flex:none; width:56px; height:56px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #93c5fd, var(--accent)); transform:scale(calc(1 + var(--level) * .6)); transition:transform .08s linear, background .3s; }
  #voice[data-state="listening"] #orb { background:radial-gradient(circle at 35% 30%, #86efac, #16a34a); }
  #voice[data-state="thinking"] #orb { animation:pulse 1s ease-in-out infinite; background:radial-gradient(circle at 35% 30%, #fcd34d, #d97706); }
  @keyframes pulse { 50% { transform:scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { #orb { transition:none; animation:none !important; } }
  #voice .body { flex:1; min-width:0; }
  #voice-q { font-weight:600; } #voice-a { color:var(--muted); font-size:13px; min-height:1.2em; }
  .hint { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>GroundZero</h1>
  <p class="sub">Upload an expert video. It is cut into 2–4 s action segments for description and questioning.</p>

  <div class="card">
    <input id="file" type="file" accept="video/*">
    <video id="video" controls playsinline hidden></video>
    <div class="row" style="margin-top:12px">
      <button id="run" disabled>Segment video</button>
      <progress id="bar" value="0" max="1" hidden></progress>
      <span id="status" class="hint"></span>
    </div>
  </div>

  <div id="tools" class="row" hidden>
    <button id="describe-all">Describe all segments</button>
    <button id="voice-start">🎙 Start voice Q&amp;A</button>
    <button id="build-tree">Build action tree</button>
  </div>
  <div id="tree" class="card" hidden>
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">Action tree</h3><button id="download-json" class="ghost">Download JSON</button></div>
    <div id="tree-svg" style="overflow-x:auto;margin:12px 0"></div>
    <div id="tree-notes" class="hint"></div>
    <div id="split" hidden style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
      <div class="hint">Selected <b id="split-title"></b></div>
      <p id="split-desc" style="margin:4px 0 8px"></p>
      <div class="row">
        <input id="split-input" type="text" placeholder="What did the expert say? e.g. first loosen the plug, then pull it out" style="flex:1;min-width:200px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit">
        <button id="split-mic" class="ghost" title="Say it">🎙</button>
        <button id="split-go">Split node</button>
      </div>
      <div id="split-msg" class="hint" style="margin-top:6px"></div>
    </div>
  </div>
  <div id="segments"></div>
  <div id="pager" class="row" hidden>
    <button id="prev">Previous</button>
    <button id="next">Next</button>
    <span id="pageinfo" class="hint"></span>
  </div>
</main>
<div id="voice" data-state="idle" hidden role="status" aria-live="polite">
  <div id="orb" aria-hidden="true"></div>
  <div class="body">
    <div class="hint"><span id="voice-label">Ready</span> · question <span id="voice-n">0</span> of <span id="voice-total">0</span></div>
    <div id="voice-q"></div>
    <div id="voice-a"></div>
  </div>
  <div class="col" style="display:flex;flex-direction:column;gap:6px">
    <button id="voice-skip" class="ghost">Skip</button>
    <button id="voice-end" class="ghost">End</button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
