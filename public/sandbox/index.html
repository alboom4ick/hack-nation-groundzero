<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandbox ERP: supplier invoices (fake data)</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:24px 16px; background:#e7e9ec; font:15px/1.4 system-ui, sans-serif; color:#1b2430; transition:background-color .8s; }
  body[data-skin=crm] { background:#cfe8dd; } body[data-skin=legal] { background:#e3d3d6; } body[data-skin=cable] { background:#f0d9a8; } body[data-skin=ops] { background:#0a0d06; }
  /* Everything themed lives inside .app. The page around it never changes. */
  .app { --ink:#1b2430; --line:#d5dbe3; --bg:#f4f6f9; --accent:#1f5fbf; --warn:#b4231b; --hdr:#16263d; --hdr-ink:#fff; --hi:#e8f0fc; --live:#e8f1ff; --panel:#fff;
         --r:6px; --pill:10px; --font:system-ui, sans-serif; --head-font:var(--font); --pad:12px; --bw:1px;
         position:relative; overflow:hidden; max-width:1360px; margin:auto; border-radius:calc(var(--r) + 6px); background:var(--bg); color:var(--ink); font-family:var(--font);
         box-shadow:0 18px 50px rgba(20,30,45,.25); transition:background-color .7s, color .7s, border-radius .7s; }
  .app[data-skin=crm]   { --ink:#17332a; --line:#d4e6dd; --bg:#eef6f2; --accent:#13795b; --hdr:#fff; --hdr-ink:#0f4c3a; --hi:#dff3ea; --live:#e3f5ed; --r:16px; --pill:999px; --font:ui-rounded, "SF Pro Rounded", system-ui, sans-serif; --pad:16px; }
  .app[data-skin=legal] { --ink:#2a1c20; --line:#d9c9cd; --bg:#f6f0ea; --accent:#8a2846; --hdr:#3b1d2a; --hi:#f1dfe3; --live:#f4e6e9; --panel:#fffdf9; --r:2px; --pill:2px; --font:Georgia, "Times New Roman", serif; --head-font:Georgia, serif; --pad:14px; }
  .app[data-skin=cable] { --ink:#2a1d08; --line:#2a1d08; --bg:#fbf1dd; --accent:#d9730d; --hdr:#1d1608; --hdr-ink:#ffc14d; --hi:#ffe2ad; --live:#ffe9c2; --panel:#fffaf0; --r:0px; --pill:0px; --font:ui-monospace, "SF Mono", Menlo, monospace; --pad:10px; --bw:2px; }
  .app[data-skin=ops]   { --ink:#d7dec0; --line:#46502d; --bg:#161a0f; --accent:#a3c13a; --hdr:#0c0f08; --hdr-ink:#a3c13a; --hi:#2a3319; --live:#242c15; --panel:#1f2514; --warn:#ff7a5c; --r:3px; --pill:3px; --font:ui-monospace, Menlo, monospace; --pad:12px; --bw:1px; }
  .app header { white-space:nowrap; height:60px; background:var(--hdr); color:var(--hdr-ink); padding:12px 20px; display:flex; align-items:center; gap:12px; transition:background-color .7s, color .7s; }
  .app header small { margin-left:auto; opacity:.7; }
  #sys { display:inline-block; }
  .app header strong { font-family:var(--head-font); letter-spacing:.01em; }
  .app[data-skin=crm] header { border-bottom:var(--bw) solid var(--line); }
  .app[data-skin=legal] header strong { font-variant:small-caps; letter-spacing:.08em; }
  .app[data-skin=cable] header { background:repeating-linear-gradient(-45deg,#1d1608 0 14px,#2d2210 14px 28px); border-bottom:4px solid var(--accent); text-transform:uppercase; }
  .app[data-skin=ops] header { border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:.12em; }
  .app main { display:grid; grid-template-columns:360px 1fr; gap:16px; padding:16px 20px 20px; height:610px; align-items:stretch; }
  .app[data-skin=crm] main { grid-template-columns:360px 1fr; gap:20px; }
  .panel { background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r); padding:var(--pad); transition:background-color .7s, border-color .7s, border-radius .7s; }
  .app[data-skin=crm] .panel { box-shadow:0 6px 20px rgba(19,121,91,.1); border-color:transparent; }
  .app[data-skin=legal] .panel { box-shadow:inset 0 0 0 4px var(--panel), inset 0 0 0 5px var(--line); padding:20px; }
  .app[data-skin=cable] .panel { box-shadow:5px 5px 0 var(--ink); }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  td, th { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  th:first-child, td:first-child { width:64px; } th:last-child, td:last-child { width:84px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  th { font-family:var(--head-font); }
  .app[data-skin=crm] td, .app[data-skin=crm] th { padding:10px 8px; border-bottom-color:transparent; }
  .app[data-skin=crm] tr.row td:first-child { border-radius:12px 0 0 12px; } .app[data-skin=crm] tr.row td:last-child { border-radius:0 12px 12px 0; }
  .app[data-skin=legal] th { font-variant:small-caps; letter-spacing:.06em; border-bottom:2px double var(--accent); }
  .app[data-skin=cable] th { background:var(--ink); color:var(--hdr-ink); text-transform:uppercase; }
  .app[data-skin=ops] th { text-transform:uppercase; color:var(--accent); letter-spacing:.1em; }
  tr.row { cursor:pointer; } tr.row:hover, tr.row.sel { background:var(--hi); }
  .app[data-skin=cable] tr.row.sel td:first-child { box-shadow:inset 6px 0 var(--accent); }
  .st { font-size:12px; padding:1px 8px; border-radius:var(--pill); background:var(--line); color:var(--ink); }
  .st.posted { background:var(--accent); color:#fff; }
  dl { display:grid; grid-template-columns:150px 1fr; gap:6px 12px; margin:0 0 12px; }
  dt { opacity:.65; white-space:nowrap; } dd { margin:0; min-height:1.4em; }
  #detail dl:first-child, .top dl { min-height:230px; align-content:start; }
  .app[data-skin=legal] dt { font-style:italic; } .app[data-skin=ops] dt { text-transform:uppercase; font-size:12px; letter-spacing:.08em; }
  select, input, textarea { font:inherit; padding:5px 8px; border:var(--bw) solid var(--line); border-radius:var(--r); width:100%; background:var(--panel); color:var(--ink); }
  .app[data-skin=cable] select, .app[data-skin=cable] input { border-width:2px; } .app[data-skin=ops] select, .app[data-skin=ops] input { background:#11150b; }
  button { font:inherit; padding:7px 16px; border-radius:var(--r); border:var(--bw) solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; transition:background-color .7s, transform .15s; }
  button:active { transform:scale(.97); }
  .app[data-skin=ops] button, .app[data-skin=cable] button { color:#111; text-transform:uppercase; font-weight:700; letter-spacing:.06em; }
  .app[data-skin=crm] button { padding:9px 22px; box-shadow:0 6px 14px rgba(19,121,91,.3); }
  button.ghost { background:transparent; color:inherit; border-color:currentColor; } button:disabled { opacity:.5; cursor:default; }
  .bar { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .top { display:flex; gap:16px; align-items:flex-start; min-height:330px; } .top dl { flex:1; }
  .arqr { flex:none; width:210px; text-align:center; color:var(--ink); text-decoration:none; }
  .arqr .arhint { margin:0 0 4px; font-size:12px; line-height:1.3; font-weight:600; }
  .arqr svg { width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:4px; }
  .arqr span { display:flex; align-items:center; justify-content:center; border:1px solid var(--line); min-height:5.9em; /* 4 lines + padding; grows if the text wraps further */ margin-top:4px; padding:3px 6px; background:#fff7cc; color:#2a2410; border-radius:min(var(--r),8px); font:12px/1.3 ui-monospace, monospace; }
  .arqr span.arlive { min-height:4.6em; /* 3 lines */ background:var(--live); color:var(--ink); }
  @media (max-width:700px) { .top { flex-direction:column-reverse; align-items:stretch; } .arqr { align-self:center; } .app main, .app[data-skin=ops] main, .app[data-skin=crm] main { grid-template-columns:1fr; } }
  #msg { margin-left:8px; } #msg.bad { color:var(--warn); font-weight:600; }
  /* Switch animation: content settles in after the skin changes. */
  .app.swap main, .app.swap #sys { animation:settle .8s both cubic-bezier(.25,.8,.25,1); }
  @keyframes settle { from { opacity:.25; transform:translateY(6px); } to { opacity:1; transform:none; } }
  #hold { position:fixed; inset:0; background:rgba(10,20,35,.55); display:flex; align-items:center; justify-content:center; z-index:9; }
  #hold[hidden] { display:none; } #hold div { background:#fff; color:#1b2430; padding:20px 24px; border-radius:8px; max-width:420px; }
</style>
</head>
<body data-skin="erp">
<div class="app" id="app" data-skin="erp">
<header><strong id="sys">Sandbox ERP · Accounts payable</strong><small>Fake data for training. Nothing here is real.</small><button id="reset" class="ghost" type="button" title="Restore all invoices to their starting state">Reset</button></header>
<main>
  <section class="panel" aria-label="Invoice inbox">
    <h2 id="list-title" style="margin:0 0 8px;font-size:16px">Open invoices</h2>
    <table><thead><tr id="cols"><th>No.</th><th>Supplier</th><th>Amount</th></tr></thead><tbody id="list"></tbody></table>
  </section>
  <section class="panel" id="detail" aria-label="Invoice detail"></section>
</main>
</div>
<div id="hold" hidden role="alertdialog" aria-live="assertive"><div><b>Checking with your tutor before saving…</b><p id="hold-text">Hold on.</p></div></div>
<script type="module" src="/sandbox/sandbox.js"></script>
</body>
</html>
